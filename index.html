<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Cyobik</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui;background:#f6f7fa;color:#111827}.box{max-width:520px;padding:32px;border:1px solid #dfe4ea;border-radius:18px;background:#fff;text-align:center}a{display:inline-block;margin:8px;padding:12px 18px;border-radius:10px;background:#4b5cb8;color:#fff;text-decoration:none;font-weight:700}</style><script>try{const saved=localStorage.getItem('cyobik-language');const detected=(navigator.language||'').toLowerCase().startsWith('tr')?'tr':'en';const lang=saved||detected;location.replace('/'+lang+'/')}catch(e){}</script></head><body><div class="box"><h1>Cyobik</h1><p>Select your language / Dilinizi seçin</p><a href="/en/" onclick="localStorage.setItem('cyobik-language','en')">English</a><a href="/tr/" onclick="localStorage.setItem('cyobik-language','tr')">Türkçe</a></div></body></html>
