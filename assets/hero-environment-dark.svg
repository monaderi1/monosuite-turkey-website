<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Cyobik environment intelligence overview</title>
  <desc id="desc">Asset inventory, relationships, protection evidence and risk signals are connected inside the customer environment to produce an evidence-backed priority queue.</desc>
