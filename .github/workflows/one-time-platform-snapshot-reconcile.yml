# One-time helper: migrate the stale Platform integration content ID to the current canonical wording, validate, then remove this file.
name: One-time Platform snapshot reconciliation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/publication-boundary-platform-itsm-fix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Reconcile Platform content ID and template baseline
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const snapshotPath = 'content/website-content.snapshot.json';
          const manifestPath = 'site/templates/manifest.json';
          const contentId = 'PLATFORM.PARAGRAPH.06';

          const oldSnapshotEn = 'Track your security posture with dashboards and scheduled reports. Integrate Cyobik into your existing operational processes through Splunk, Nessus and Jira integrations; use the comprehensive REST API and Swagger/OpenAPI documentation to develop integrations tailored to your needs.';
          const oldTr = "Gösterge panelleri ve planlı raporlarla güvenlik durumunuzu takip edin. Splunk, Nessus ve Jira entegrasyonlarıyla Cyobik'i mevcut operasyonel süreçlerinize dahil edin; kapsamlı REST API ve Swagger/OpenAPI dokümantasyonu ile ihtiyaçlarınıza özel entegrasyonlar geliştirin.";
          const oldTemplateEn = 'Use dashboards, scheduled reports, named Splunk, Nessus and Jira integrations, and the comprehensive REST API with complete Swagger/OpenAPI documentation.';
          const newEn = 'Track your security posture with dashboards and scheduled reports. Integrate Cyobik into your existing operational processes through Splunk, Nessus and ITSM/ticketing integrations; use the comprehensive REST API and Swagger/OpenAPI documentation to develop integrations tailored to your needs.';
          const newTr = "Gösterge panelleri ve planlı raporlarla güvenlik durumunuzu takip edin. Splunk, Nessus ve ITSM / talep yönetimi entegrasyonlarıyla Cyobik'i mevcut operasyonel süreçlerinize dahil edin; kapsamlı REST API ve Swagger/OpenAPI dokümantasyonu ile ihtiyaçlarınıza özel entegrasyonlar geliştirin.";

          const snapshot = JSON.parse(fs.readFileSync(snapshotPath, 'utf8'));
          const platform = snapshot.routes?.platform;
          const item = platform?.content?.[contentId];
          if (!item) throw new Error(`${contentId} not found`);
          if (platform.sourcePage?.id !== '15532033') throw new Error('Unexpected Platform source page ID');
          if (item.en === oldSnapshotEn && item.tr === oldTr) {
            item.en = newEn;
            item.tr = newTr;
          } else if (item.en !== newEn || item.tr !== newTr) {
            throw new Error('Unexpected Platform snapshot content; refusing a blind replacement.');
          }
          platform.sourcePage.version = 7;
          fs.writeFileSync(snapshotPath, JSON.stringify(snapshot, null, 2) + '\n');

          const templateMigrations = [
            ['site/templates/routes/platform.en.html', oldTemplateEn, newEn],
            ['site/templates/routes/platform.tr.html', oldTr, newTr],
          ];
          for (const [path, oldValue, newValue] of templateMigrations) {
            let source = fs.readFileSync(path, 'utf8');
            if (source.includes(oldValue)) {
              source = source.replace(oldValue, newValue);
            } else if (!source.includes(newValue)) {
              throw new Error(`${path}: expected Platform baseline not found`);
            }
            fs.writeFileSync(path, source);
          }

          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          for (const [lang, value] of [['en', newEn], ['tr', newTr]]) {
            const matches = manifest.htmlBindings.filter(binding =>
              binding.routeKey === 'platform' && binding.lang === lang && binding.contentId === contentId
            );
            if (matches.length !== 1) throw new Error(`Expected exactly one ${contentId}.${lang} manifest binding; found ${matches.length}`);
            const binding = matches[0];
            if (binding.renderer !== 'simple' || binding.tagName !== 'p') {
              throw new Error(`Unexpected renderer/tag for ${contentId}.${lang}`);
            }
            binding.baseline = value;
            binding.elementBaseline = value;
            binding.prefix = '';
            binding.suffix = '';
          }
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate from the reconciled snapshot
        run: npm run site:build

      - name: Validate all website content
        run: npm test --offline

      - name: Remove helper and commit the canonical reconciliation
        shell: bash
        run: |
          rm .github/workflows/one-time-platform-snapshot-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reconcile Platform integration copy to ITSM canonical'
          git push origin HEAD:${{ github.head_ref }}
